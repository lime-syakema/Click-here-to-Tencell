<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Redirect</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

img {
    width: 100vw;
    height: 100vh;
    object-fit: fill; /* 画面いっぱいに引き伸ばす */
    display: block;
}
</style>

<script>
setTimeout(() => {
    window.location.href = "https://roblox-slap-battles.fandom.com/wiki/Special:Random";
}, 1000); // 1秒後に移動
</script>

</head>
<body>

<img src="image.png" alt="画像">

</body>
</html>
